		<style>
			@import url("https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400&display=swap");

			*,
			*::before,
			*::after {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}

			:root {
				--bg: hsl(234deg 30% 15%);
				--surface: rgba(255, 255, 255, 0.06);
				--surface-hover: rgba(255, 255, 255, 0.12);
				--border: rgba(255, 255, 255, 0.1);
				--text: rgba(255, 255, 255, 0.85);
				--text-dim: rgba(255, 255, 255, 0.45);
				--accent: #c084fc;
				--radius: 12px;
			}

			html,
			body {
				height: 100%;
				background-color: var(--bg);
				font-family: "DM Sans", sans-serif;
				font-weight: 300;
				color: var(--text);
				min-height: 100vh;
			}

			/* Search box sits near the top (body's own padding); row-gap repeats that same
			   distance below it before the speed dial. Leftover space collects at the bottom. */
			body {
				display: grid;
				grid-template-rows: auto auto 1fr;
				row-gap: 5rem;
				justify-items: center;
				padding: 5rem 1rem;
			}

			/* Search box */
			.search-form {
				grid-row: 1;
				width: 100%;
				max-width: 900px;
			}

			.search-input {
				width: 100%;
				padding: 0.7rem 1rem;
				border-radius: var(--radius);
				border: 1px solid var(--border);
				background: var(--surface);
				color: var(--text);
				font-family: inherit;
				font-size: 16px;
				font-weight: 300;
				outline: none;
				transition:
					background 0.15s,
					border-color 0.15s;
			}

			.search-input::placeholder {
				color: var(--text-dim);
			}

			.search-input:focus {
				background: var(--surface-hover);
				border-color: var(--accent);
			}

			/* Bangs reference panel */
			.bangs-details {
				position: relative;
				margin-top: 0.35rem;
			}

			.bangs-details summary {
				width: fit-content;
				list-style: none;
				cursor: pointer;
				color: var(--text-dim);
				font-size: 0.8rem;
				letter-spacing: 0.02em;
				user-select: none;
			}

			.bangs-details summary::-webkit-details-marker {
				display: none;
			}

			.bangs-details summary::before {
				content: "▸ ";
			}

			.bangs-details[open] summary::before {
				content: "▾ ";
			}

			.bangs-details summary:hover {
				color: var(--text);
			}

			/* Positioned out of flow so opening it never shifts the grid below. */
			.bangs-list {
				position: absolute;
				top: calc(100% + 0.5rem);
				left: 0;
				right: 0;
				z-index: 10;
				padding: 0.85rem 1rem;
				columns: 150px;
				column-gap: 1.25rem;
				background: var(--surface);
				border: 1px solid var(--border);
				border-radius: var(--radius);
				box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
				max-height: 40vh;
				overflow-y: hidden;
				overflow-x: auto;
				backdrop-filter: blur(8px);
			}

			.bang-entry {
				display: flex;
				align-items: baseline;
				gap: 0.4rem;
				font-size: 0.85rem;
				white-space: nowrap;
				break-inside: avoid;
				margin-bottom: 0.35rem;
			}

			.bang-entry code {
				color: var(--accent);
				font-family: ui-monospace, "SF Mono", Consolas, monospace;
				flex-shrink: 0;
			}

			.bang-entry span {
				color: var(--text-dim);
				overflow: hidden;
				text-overflow: ellipsis;
			}

			/* Links grid */
			.links-grid {
				grid-row: 2;
				display: grid;
				grid-template-columns: repeat(6, 1fr);
				gap: 0.5rem 1.75rem;
				width: 100%;
				max-width: 900px;
			}

			.link-item {
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 0.4rem;
				padding: 0.6rem 0.4rem;
				border-radius: var(--radius);
				text-decoration: none;
				color: var(--text);
				font-size: 15px;
				letter-spacing: 0.01em;
				transition:
					background 0.15s,
					color 0.15s,
					transform 0.15s;
			}

			.link-item:hover {
				background: var(--surface-hover);
				color: var(--text);
				transform: translateY(-2px);
			}

			.link-item img {
				width: 28px;
				height: 28px;
				border-radius: 4px;
				display: block;
				flex-shrink: 0;
				opacity: 0;
				transition: opacity 0.2s;
			}

			.link-item img.loaded {
				opacity: 1;
			}

			/* Placeholder shown while icon loads or if it fails */
			.link-item .icon-placeholder {
				width: 28px;
				height: 28px;
				border-radius: 4px;
				background: var(--surface);
				display: flex;
				align-items: center;
				justify-content: center;
				font-size: 0.6rem;
				font-weight: 400;
				color: var(--text-dim);
				flex-shrink: 0;
				text-transform: uppercase;
			}

			@media (max-width: 640px) {
				.links-grid {
					grid-template-columns: repeat(4, 1fr);
				}
			}
			@media (max-width: 420px) {
				.links-grid {
					grid-template-columns: repeat(3, 1fr);
				}
			}
		</style>

			// ICONS:END

			// ─── Search ──────────────────────────────────────────────────────────────────
			// A !bang anywhere in the query picks the engine; the rest of the text is the
			// search term. An unrecognized or missing bang falls back to SEARCH_ENGINES.default.
			const searchForm = document.getElementById("search-form");
			const searchInput = document.getElementById("search-input");

			searchForm.addEventListener("submit", (event) => {
				event.preventDefault();
				const query = searchInput.value.trim();
				if (!query) return;

				const bangMatch = query.match(/(?:^|\s)!(\S+)/);
				let engine = SEARCH_ENGINES.default;
				let term = query;

				if (bangMatch) {
					const bang = bangMatch[1].toLowerCase();
					if (bang in SEARCH_ENGINES.bangs) {
						engine = SEARCH_ENGINES.bangs[bang];
						term = (query.slice(0, bangMatch.index) + query.slice(bangMatch.index + bangMatch[0].length)).trim();
					}
				}

				window.location.href = engine.url.replace("%s", encodeURIComponent(term));
			});

			searchInput.focus();

			// ─── Bangs list panel ────────────────────────────────────────────────────────
			// Built from SEARCH_ENGINES so the list can never drift from what actually works.
			const bangsList = document.getElementById("bangs-list");
			const bangEntries = Object.entries(SEARCH_ENGINES.bangs).sort(([a], [b]) =>
				a.localeCompare(b),
			);
			bangsList.innerHTML = [
				`<div class="bang-entry"><code>default</code><span>${SEARCH_ENGINES.default.name}</span></div>`,
				...bangEntries.map(
					([bang, { name }]) =>
						`<div class="bang-entry"><code>!${bang}</code><span>${name}</span></div>`,
				),
			].join("");

			// Close the panel on any click outside it, or when focus returns to the input.
			const bangsDetails = document.querySelector(".bangs-details");
			document.addEventListener("click", (event) => {
				if (bangsDetails.open && !bangsDetails.contains(event.target)) {
					bangsDetails.open = false;
				}
			});
			searchInput.addEventListener("focus", () => {
				bangsDetails.open = false;
			});

			// ─── Build grid ──────────────────────────────────────────────────────────────
			const grid = document.getElementById("links-grid");

			// Render all links immediately with letter placeholders, then resolve icons.
			const items = LINKS.map(({ label, href, domain, icon }) => {
				const a = document.createElement("a");
				a.className = "link-item";
				a.href = href;
				a.rel = "noopener noreferrer";

				const placeholder = document.createElement("span");
				placeholder.className = "icon-placeholder";
				placeholder.textContent = label.charAt(0);

				const img = document.createElement("img");
				img.alt = "";
				img.width = 28;
				img.height = 28;

				img.addEventListener("load", () => {
					img.classList.add("loaded");
					placeholder.style.display = "none";
				});
				img.addEventListener("error", () => {
					img.style.display = "none"; // keep letter placeholder visible
				});

				a.appendChild(placeholder);
				a.appendChild(img);
				a.appendChild(document.createTextNode(label));
				grid.appendChild(a);

				return { img, domain, icon };
			});

			// ─── Resolve icons ───────────────────────────────────────────────────────────
			// Precedence: a bundled override, then the build-time inlined favicon, then a live
			// fetch as a fallback. The first two need no network at all.
			for (const { img, domain, icon } of items) {
				img.src = icon ?? ICONS[domain] ?? FAVICON_API(domain);
			}
		</script>
